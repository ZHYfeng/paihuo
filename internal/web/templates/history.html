{{define "content"}}
<header class="page-header">
  <div class="page-identity">
    <span class="page-kicker">ACTIVITY ARCHIVE</span>
    <h1>任务历史</h1>
  </div>
  <span class="spacer"></span>
  <span class="header-note">检索与维护历史交付记录</span>
</header>
<div class="page-content">
  <div class="toolbar history-toolbar">
    <div class="toolbar-group" role="group" aria-label="历史任务筛选">
      <select id="hAgent" class="sel-md" aria-label="按角色筛选历史任务" onchange="loadHistory()"><option value="">全部角色</option></select>
      <select id="hStatus" class="sel-sm" aria-label="按状态筛选历史任务" onchange="loadHistory()">
        <option value="">全部状态</option>
        <option value="succeeded">完成</option>
        <option value="failed">失败</option>
        <option value="cancelled">已取消</option>
        <option value="awaiting_review">待审批</option>
        <option value="queued">待执行</option>
        <option value="running">执行中</option>
      </select>
      <input id="hDays" type="number" min="0" aria-label="筛选最近多少天的任务" placeholder="最近N天" class="sel-xs" onchange="loadHistory()">
      <button class="btn sm" onclick="loadHistory()">筛选</button>
    </div>
    <span class="spacer"></span>
    <div class="toolbar-group toolbar-actions" role="group" aria-label="历史任务批量操作">
      <button class="btn sm" onclick="selectAllNonMergeTasks()">全选非合并任务</button>
      <button class="btn sm danger" onclick="deleteSelected()">删除选中（<span id="hSelCount">0</span>）</button>
      <button class="btn sm danger" onclick="cleanupHistory()">清理筛选结果</button>
    </div>
  </div>
  <div class="list-wrap">
    <table class="list-grid history-grid">
      <thead><tr>
        <th class="chk"><input type="checkbox" id="hCheckAll" onchange="toggleAll(this.checked)" aria-label="全选当前筛选结果" title="全选当前筛选结果"></th>
        <th>ID</th><th>标题</th><th>角色</th><th>项目</th><th>权限</th><th>状态</th><th>轮次</th><th>创建</th><th>结束</th><th style="width:110px">操作</th>
      </tr></thead>
      <tbody id="historyBody"></tbody>
    </table>
    <div id="historyEmpty" class="empty hidden">
      <b class="empty-title">没有符合当前条件的任务</b>
      <span class="empty-copy">调整筛选范围，或返回看板查看正在流转的任务。</span>
      <a class="btn sm" href="/board">打开任务看板</a>
    </div>
  </div>
</div>
{{end}}
