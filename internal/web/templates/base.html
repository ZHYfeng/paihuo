{{define "base"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>派活 PaiHuo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2338bdf8'/%3E%3Cstop offset='1' stop-color='%236366f1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-size='32' font-weight='700' text-anchor='middle' fill='white' font-family='sans-serif'%3E派%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span class="logo-mark">派</span>
      <span class="text">派活 PaiHuo</span>
      <button class="sb-toggle" id="sbToggle" onclick="toggleSidebar()" title="收起侧边栏 (Ctrl+B)" aria-label="收起或展开侧边栏">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-group-label">工作区</div>
      <a class="sidebar-link {{if eq .Active "board"}}active{{end}}" href="/">
        <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7v8H3zM14 3h7v5h-7zM14 11h7v10h-7zM3 14h7v7H3z"/></svg>
        <span>看板</span><span class="s-count" id="sbBoardCount"></span>
      </a>
      <a class="sidebar-link {{if eq .Active "projects"}}active{{end}}" href="/projects">
        <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
        <span>项目</span><span class="s-count" id="sbProjectCount"></span>
      </a>
      <a class="sidebar-link {{if eq .Active "history"}}active{{end}}" href="/history">
        <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 3"/></svg>
        <span>历史</span>
      </a>
      <div class="sidebar-group-label">智能体</div>
      <a class="sidebar-link {{if eq .Active "agents"}}active{{end}}" href="/agents">
        <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8Zm5-2V6a3 3 0 0 1 6 0v2M9 15h.01M15 15h.01"/></svg>
        <span>角色</span>
      </a>
      <a class="sidebar-link {{if eq .Active "autopilots"}}active{{end}}" href="/autopilots">
        <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></svg>
        <span>定时任务</span>
      </a>
      <a class="sidebar-link {{if eq .Active "skills"}}active{{end}}" href="/skills">
        <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.4L19 10l-5.2 1.6L12 17l-1.8-5.4L5 10l5.2-1.6L12 3Z"/></svg>
        <span>技能模板</span>
      </a>
      <div class="sidebar-group-label">配置</div>
      <a class="sidebar-link {{if eq .Active "settings"}}active{{end}}" href="/settings">
        <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9l2.1 2.1m10 10 2.1 2.1m0-14.2-2.1 2.1m-10 10-2.1 2.1"/></svg>
        <span>设置</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="sidebar-link" onclick="logout()" style="width:100%;border:none;background:none;cursor:pointer;color:var(--fg-muted)">
        <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4m7 14 5-5-5-5m5 5H9"/></svg>
        <span>登出</span>
      </button>
    </div>
  </aside>
  <main class="main">
    {{template "content" .}}
  </main>
</div>
<div id="toast" class="toast hidden"></div>

<!-- 全屏终端（所有页面共享） -->
<div class="modal hidden" id="termModal">
  <div class="modal-box term-modal">
    <div class="term" style="margin:0;border-radius:0;border:none;flex:1;display:flex;flex-direction:column">
      <div class="term-head">
        <span class="term-dots"><i></i><i></i><i></i></span>
        <span class="t-title" id="termTitle"></span>
        <button class="btn ghost xs" onclick="closeTerminal()">关闭</button>
      </div>
      <div class="term-body term-full" id="termBox"></div>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
{{end}}
