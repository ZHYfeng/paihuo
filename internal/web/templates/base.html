{{define "base"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>派活 PaiHuo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2338bdf8'/%3E%3Cstop offset='1' stop-color='%236366f1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-size='32' font-weight='700' text-anchor='middle' fill='white' font-family='sans-serif'%3E派%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/vendor/xterm.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span class="logo-mark">派</span>
      <span class="text">派活 PaiHuo</span>
      <button class="sb-toggle" id="sbToggle" onclick="toggleSidebar()" title="收起侧边栏 (Ctrl+B)" aria-label="收起或展开侧边栏">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-group-label">工作区</div>
      <a class="sidebar-link {{if eq .Active "dashboard"}}active{{end}}" href="/">
        <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h8v8H3zM13 3h8v5h-8zM13 11h8v10h-8zM3 14h8v7H3z"/></svg>
        <span>工作台</span>
      </a>
      <a class="sidebar-link {{if eq .Active "board"}}active{{end}}" href="/board">
        <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5Zm5 2v10m4-10v6m4-6v10"/></svg>
        <span>看板</span>
      </a>
      <a class="sidebar-link {{if eq .Active "history"}}active{{end}}" href="/history">
        <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 3"/></svg>
        <span>历史</span>
      </a>
      <div class="sidebar-group-label">管理</div>
      <a class="sidebar-link {{if eq .Active "agents"}}active{{end}}" href="/agents">
        <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8Zm5-2V6a3 3 0 0 1 6 0v2M9 15h.01M15 15h.01"/></svg>
        <span>智能体</span>
      </a>
      <a class="sidebar-link {{if eq .Active "roles"}}active{{end}}" href="/roles">
        <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4 21a8 8 0 0 1 16 0"/></svg>
        <span>角色</span>
      </a>
      <a class="sidebar-link {{if eq .Active "skills"}}active{{end}}" href="/skills">
        <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.4L19 10l-5.2 1.6L12 17l-1.8-5.4L5 10l5.2-1.6L12 3Z"/></svg>
        <span>技能</span>
      </a>
      <a class="sidebar-link {{if eq .Active "autopilots"}}active{{end}}" href="/autopilots">
        <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></svg>
        <span>定时任务</span>
      </a>
      <div class="sidebar-group-label">系统</div>
      <a class="sidebar-link {{if eq .Active "settings"}}active{{end}}" href="/settings">
        <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9l2.1 2.1m10 10 2.1 2.1m0-14.2-2.1 2.1m-10 10-2.1 2.1"/></svg>
        <span>设置</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="sidebar-link" onclick="logout()" style="width:100%;border:none;background:none;cursor:pointer;color:var(--fg-muted)">
        <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4m7 14 5-5-5-5m5 5H9"/></svg>
        <span>登出</span>
      </button>
    </div>
  </aside>
  <main class="main">
    {{template "content" .}}
  </main>
</div>
<div id="toast" class="toast hidden"></div>

<!-- 任务详情（两栏，Dashboard / Board 共享） -->
<div id="detailShell" class="hidden">
  <header class="page-header">
    <button class="btn ghost sm" onclick="closeDetail()">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      返回
    </button>
    <span class="crumb" id="dCrumb"></span>
    <span class="spacer"></span>
    <span id="dBadge"></span>
  </header>
  <div class="detail-view">
    <div class="detail-main" id="dMain"></div>
    <aside class="detail-side" id="dSide"></aside>
  </div>
</div>

<!-- 新建任务弹窗（全站共享） -->
<div class="modal hidden" id="taskModal">
  <div class="modal-box">
    <h3 id="taskModalTitle">新建任务</h3>
    <div class="sub">指派给角色执行，可选用模板填充提示词</div>
    <input type="hidden" id="tParentId">
    <label class="field">从模板填充
      <select id="tTemplate" onchange="applyTemplate()"><option value="">—</option></select>
    </label>
    <label class="field">标题 <input id="tTitle" placeholder="要做什么"></label>
    <label class="field">提示词
      <textarea id="tBody" rows="5" placeholder="给 agent 的详细指令。留空则由标题生成。"></textarea>
    </label>
    <div class="row">
      <label class="field">角色 <select id="tAgent"></select></label>
      <label class="field">项目 <select id="tProject"></select></label>
    </div>
    <label class="field">权限
      <select id="tPerm">
        <option value="full">Full（直接执行）</option>
        <option value="review">Review（完成后审批）</option>
      </select>
    </label>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('taskModal')">取消</button>
      <button class="btn primary" onclick="submitTask()">创建</button>
    </div>
  </div>
</div>

<!-- 新建/编辑项目弹窗（全站共享） -->
<div class="modal hidden" id="projectModal">
  <div class="modal-box">
    <h3 id="projectModalTitle">新建项目</h3>
    <div class="sub">项目是任务管理的维度：工作目录 + 聚合任务进度与 agent 统计</div>
    <input type="hidden" id="pId">
    <label class="field">名称 <input id="pName" placeholder="如：公司官网重构"></label>
    <label class="field">工作目录
      <span class="dir-input-row">
        <input id="pProjectDir" placeholder="/path/to/project" list="dlistProj">
        <datalist id="dlistProj"></datalist>
        <button type="button" class="btn sm" onclick="openDirPicker('pProjectDir')">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
          浏览…
        </button>
      </span>
    </label>
    <label class="field">描述 <textarea id="pDesc" rows="3" placeholder="这个项目要交付什么"></textarea></label>
    <label class="field">状态
      <select id="pStatus">
        <option value="active">进行中</option>
        <option value="archived">已归档</option>
      </select>
    </label>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('projectModal')">取消</button>
      <button class="btn primary" onclick="submitProject()">保存</button>
    </div>
  </div>
</div>

<!-- 目录选择器（全站共享） -->
<div class="modal hidden" id="dirModal">
  <div class="modal-box">
    <h3>选择目录</h3>
    <div class="sub">浏览服务器文件系统</div>
    <div class="dir-crumb" id="dirCrumb"></div>
    <div class="dir-list" id="dirList"></div>
    <div class="dir-new">
      <input id="dirNewName" placeholder="新建子目录名（在当前目录下）" onkeydown="if(event.key==='Enter')mkdirCurrent()">
      <button class="btn sm" onclick="mkdirCurrent()">创建</button>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('dirModal')">取消</button>
      <button class="btn primary" onclick="pickDir()">使用此目录</button>
    </div>
  </div>
</div>

<!-- 安装输出终端（Agents 页安装向导） -->
<div class="modal hidden" id="instModal">
  <div class="modal-box term-modal">
    <div class="term" style="margin:0;border-radius:0;border:none;flex:1;display:flex;flex-direction:column">
      <div class="term-head">
        <span class="t-title" id="instTitle"></span>
        <button class="btn ghost xs" onclick="closeInstTerminal()">关闭</button>
      </div>
      <div class="term-body term-full" id="instBox"></div>
    </div>
  </div>
</div>

<!-- 全屏终端（所有页面共享） -->
<div class="modal hidden" id="termModal">
  <div class="modal-box term-modal">
    <div class="term" style="margin:0;border-radius:0;border:none;flex:1;display:flex;flex-direction:column">
      <div class="term-head">
        <span class="term-dots"><i></i><i></i><i></i></span>
        <span class="t-title" id="termTitle"></span>
        <button class="btn ghost xs" onclick="closeTerminal()">关闭</button>
      </div>
      <div class="term-body term-full" id="termX" style="padding:0"></div>
    </div>
  </div>
</div>

<script src="/static/vendor/xterm.js"></script>
<script src="/static/vendor/addon-fit.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
{{end}}
