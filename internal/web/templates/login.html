{{define "base"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 派活 PaiHuo</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-body">
<div class="login-card">
  <div class="login-logo">派活<span>PaiHuo</span></div>
  <p class="login-sub">个人 agent 调度平台</p>
  {{if .LoginError}}<div class="login-error">{{.LoginError}}</div>{{end}}
  <form method="post" action="/login" autocomplete="off">
    <label>访问令牌</label>
    <input type="password" name="token" id="loginToken" placeholder="输入令牌登录" autofocus required>
    <button type="submit" class="btn primary login-btn">登 录</button>
  </form>
</div>
<script>document.getElementById("loginToken").focus();</script>
</body>
</html>
{{end}}
