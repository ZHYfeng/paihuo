{{define "base"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f6f6f3">
  <title>登录 · 派活 PaiHuo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235663d9'/%3E%3Ctext x='32' y='45' font-size='34' font-weight='600' text-anchor='middle' fill='white' font-family='sans-serif'%3E派%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/login.css">
</head>
<body>
  <main class="login-stage">
    <section class="login-hero" aria-label="派活产品介绍">
      <div class="login-hero-brand">
        <span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3" /></svg></span>
        <span><b>派活</b><small>PAIHUO</small></span>
      </div>
      <div class="login-hero-copy">
        <span class="login-eyebrow">A LITTLE LESS BUSY. A LOT MORE DONE.</span>
        <h1>把想法交给角色，<br><em>把时间留给创造。</em></h1>
        <p>让项目、任务与智能体各就其位。<br>从一个想法出发，走到每一次清晰的交付。</p>
        <div class="login-flow" aria-label="项目、任务、执行、审批的工作主线"><div><small>01</small><b>建立项目</b></div><div><small>02</small><b>派发任务</b></div><div><small>03</small><b>跟进执行</b></div><div><small>04</small><b>审批交付</b></div></div>
      </div>
      <div class="login-hero-foot"><span>个人工作空间</span><span>本机部署</span><span>专注交付</span></div>
    </section>
    <section class="login-form-area" aria-labelledby="loginTitle">
      <div class="login-card">
        <div class="login-card-head"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/></svg>你的专属工作空间</div>
        <h2 id="loginTitle">欢迎回来。</h2>
        <p class="login-sub">输入访问令牌，继续推进你的项目。</p>
        {{if .LoginError}}<div class="login-error" role="alert">{{.LoginError}}</div>{{end}}
        <form method="post" action="/login" autocomplete="off">
          <label class="field" for="loginToken">访问令牌</label>
          <input type="password" name="token" id="loginToken" placeholder="输入你的访问令牌" autofocus required>
          <button type="submit" class="login-btn">进入工作台 <span aria-hidden="true">→</span></button>
        </form>
        <div class="login-foot"><span class="runtime-dot" aria-hidden="true"></span>仅向受信任的管理员开放</div>
      </div>
      <div class="login-form-foot">PAIHUO · 让每一次派活都有着落</div>
    </section>
  </main>
</body>
</html>
{{end}}
