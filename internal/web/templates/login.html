{{define "base"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 派活 PaiHuo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23d7fa89'/%3E%3Cstop offset='1' stop-color='%2374e0bc'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-size='32' font-weight='800' text-anchor='middle' fill='%2311150f' font-family='sans-serif'%3E派%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-body">
<div class="login-card">
  <div class="login-logo">
    <span class="logo-mark">派</span>
    <span class="login-brand-copy"><b>派活</b><small>PAIHUO / OPS</small></span>
  </div>
  <div class="login-kicker">LOCAL AI OPERATIONS</div>
  <h1>欢迎回来</h1>
  <p class="login-sub">进入你的本地智能体调度中枢</p>
  {{if .LoginError}}<div class="login-error">{{.LoginError}}</div>{{end}}
  <form method="post" action="/login" autocomplete="off">
    <label class="field">访问令牌</label>
    <input type="password" name="token" id="loginToken" placeholder="输入令牌登录" autofocus required>
    <button type="submit" class="btn primary login-btn">安全登录 <span aria-hidden="true">→</span></button>
  </form>
  <div class="login-foot"><span class="runtime-dot"></span> 数据与任务均在本机运行</div>
</div>
<script>document.getElementById("loginToken").focus();</script>
</body>
</html>
{{end}}
