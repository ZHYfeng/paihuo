{{define "base"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 派活 PaiHuo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2338bdf8'/%3E%3Cstop offset='1' stop-color='%236366f1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-size='32' font-weight='700' text-anchor='middle' fill='white' font-family='sans-serif'%3E派%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-body">
<div class="login-card">
  <div class="login-logo">
    <span class="logo-mark">派</span>
    <span>派活 PaiHuo</span>
  </div>
  <p class="login-sub">个人 agent 调度平台</p>
  {{if .LoginError}}<div class="login-error">{{.LoginError}}</div>{{end}}
  <form method="post" action="/login" autocomplete="off">
    <label class="field">访问令牌</label>
    <input type="password" name="token" id="loginToken" placeholder="输入令牌登录" autofocus required>
    <button type="submit" class="btn primary login-btn">登 录</button>
  </form>
</div>
<script>document.getElementById("loginToken").focus();</script>
</body>
</html>
{{end}}
