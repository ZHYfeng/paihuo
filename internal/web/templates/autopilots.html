{{define "content"}}
<header class="page-header">
  <div class="page-identity">
    <span class="page-kicker">AUTOMATIONS</span>
    <h1>定时任务</h1>
  </div>
  <span class="spacer"></span>
  <span class="header-note">让重复工作按计划自动执行</span>
  <button class="btn brand sm" onclick="openScheduleModal()">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    新建定时任务
  </button>
</header>
<div class="page-content">
  <div class="toolbar">
    <span class="toolbar-note">按周期、日期和时间创建任务。绑定项目后按项目创建顺序执行；不绑定项目则是通用定时任务。</span>
    <span class="spacer"></span>
  </div>
  <div class="list-wrap">
    <table class="list-grid">
      <thead><tr><th>名称</th><th>执行时间</th><th>角色</th><th>类型 / 项目</th><th>标题模板</th><th>上次执行</th><th>启用</th><th style="width:100px">操作</th></tr></thead>
      <tbody id="scheduleList"></tbody>
    </table>
    <div id="scheduleEmpty" class="empty hidden">还没有定时任务，点击右上角「新建定时任务」</div>
  </div>
</div>

<div class="modal hidden" id="scheduleModal">
  <div class="modal-box">
    <h3 id="scheduleModalTitle">新建定时任务</h3>
    <div class="sub">模板变量：{{"{{.date}}"}} 日期、{{"{{.time}}"}} 时间、{{"{{.name}}"}} 任务名。项目定时任务只负责定时创建，执行仍按项目顺序。</div>
    <input type="hidden" id="sId">
    <label class="field">名称 <input id="sName" data-autofocus placeholder="每日巡检"></label>
    <div class="row">
      <label class="field">角色 <select id="sAgent"></select></label>
      <label class="field">项目 <select id="sProject"></select></label>
    </div>
    <div class="schedule-picker">
      <div class="schedule-picker-title">执行时间</div>
      <div class="row">
        <label class="field schedule-frequency">周期
          <select id="sFrequency" onchange="syncScheduleFields()">
            <option value="daily">每天</option>
            <option value="weekdays">工作日（周一至周五）</option>
            <option value="weekly">每周</option>
            <option value="monthly">每月</option>
          </select>
        </label>
        <label class="field schedule-weekday hidden" id="sWeekdayField">星期
          <select id="sWeekday" onchange="syncScheduleFields()">
            <option value="1">星期一</option>
            <option value="2">星期二</option>
            <option value="3">星期三</option>
            <option value="4">星期四</option>
            <option value="5">星期五</option>
            <option value="6">星期六</option>
            <option value="7">星期日</option>
          </select>
        </label>
        <label class="field schedule-monthday hidden" id="sMonthdayField">日期
          <select id="sMonthday" onchange="syncScheduleFields()"></select>
        </label>
        <label class="field schedule-time">时间
          <input id="sTime" type="time" value="09:00" step="60" onchange="syncScheduleFields()">
        </label>
      </div>
      <div class="schedule-preview" id="sSchedulePreview"></div>
    </div>
    <label class="field">生成任务的权限
      <select id="sPerm"><option value="full">自动（完成后派发代码合并任务）</option><option value="review">人工审批（通过后由 Agent 合并）</option></select>
    </label>
    <label class="field">标题模板 <input id="sTitle" placeholder="每日巡检 {{"{{.date}}"}}"></label>
    <label class="field">提示词模板 <textarea id="sBody" rows="4" placeholder="检查服务状态并汇报。可用 {{"{{.date}}"}} 变量"></textarea></label>
    <label class="field" style="display:flex;gap:8px;align-items:center;margin-top:12px">
      <input type="checkbox" id="sBlockOnFailure" style="width:auto"> 新建任务或其代码合并失败时阻塞后续自动任务
    </label>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('scheduleModal')">取消</button>
      <button class="btn primary" onclick="submitSchedule()">保存</button>
    </div>
  </div>
</div>
{{end}}
