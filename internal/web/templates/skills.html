{{define "content"}}
<header class="page-header">
  <div class="page-identity">
    <span class="page-kicker">CAPABILITY LIBRARY</span>
    <h1>技能库</h1>
  </div>
  <span class="spacer"></span>
  <span class="header-note">沉淀可复用的执行能力</span>
  <button class="btn brand sm" id="btnAddSkill" onclick="openSkillModal()">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    添加技能
  </button>
  <button class="btn brand sm hidden" id="btnAddExt" onclick="openExtModal()">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    添加扩展
  </button>
</header>
<div class="page-content">
  <div class="toolbar">
    <div class="seg" id="skillViewSeg">
      <button id="segSkillLib" class="active" onclick="setSkillTab('skills')">技能</button>
      <button id="segExt" onclick="setSkillTab('ext')">扩展（pi）</button>
    </div>
    <div class="seg hidden" id="skillDisplaySeg" aria-label="技能显示模式">
      <button id="segSkillGrid" class="active" onclick="setSkillView('grid')">卡片</button>
      <button id="segSkillList" onclick="setSkillView('list')">列表</button>
    </div>
    <div class="skill-filter-controls hidden" id="skillFilterControls">
      <input id="skillSearch" class="inp" aria-label="搜索技能" placeholder="搜索技能…" oninput="renderSkillLib()">
      <select id="skillTagFilter" onchange="renderSkillLib()" aria-label="按标签筛选技能">
        <option value="">全部标签</option>
      </select>
    </div>
    <span class="spacer"></span>
    <div class="skill-manage-controls" id="skillManageControls">
      <label class="skill-check-all"><input type="checkbox" id="skillCheckAll" onchange="toggleAllSkills(this.checked)">全选</label>
      <span id="skillSelectedCount" class="count-info">已选 0</span>
      <button class="btn sm danger" id="btnDeleteSkills" onclick="deleteSelectedSkills()" disabled>删除选中</button>
    </div>
    <span id="skillCount" class="count-info"></span>
  </div>

  <!-- Skills 库 -->
  <div id="skillShell">
    <div class="skill-groups" id="skillGrid"></div>
    <div id="skillEmpty" class="empty hidden">
      <b class="empty-title">沉淀第一个可复用技能</b>
      <span class="empty-copy">导入单个技能目录，或扫描一个目录树中的全部 skills。</span>
      <button type="button" class="btn brand sm" onclick="openSkillModal()">添加技能</button>
    </div>
  </div>

  <!-- Skill 详情 -->
  <div id="skillDetailShell" class="hidden">
    <header class="page-header">
      <button class="btn ghost sm" onclick="closeSkillDetail()">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        返回
      </button>
      <span class="crumb" id="sdCrumb"></span>
      <span class="spacer"></span>
      <span id="sdBadge"></span>
    </header>
    <div class="detail-view skill-detail">
      <div class="detail-main" id="sdMain"></div>
      <aside class="detail-side" id="sdSide"></aside>
    </div>
  </div>

  <!-- Pi Extensions -->
  <div id="extShell" class="hidden">
    <div class="ext-wrap">
      <div class="ext-note">Pi 扩展通过官方 <code>pi install</code> 管理：来源可以是本地目录或远程仓库。安装后对所有 pi/omp 角色生效。</div>
      <pre class="ext-raw" id="extRaw">加载中...</pre>
      <div class="ext-actions">
        <span class="count-info">管理操作</span>
        <button class="btn sm danger" onclick="removeExt()">移除扩展（输入名称）</button>
      </div>
    </div>
  </div>
</div>

<!-- 添加技能弹窗 -->
<div class="modal hidden" id="skillModal">
  <div class="modal-box">
    <h3>添加技能</h3>
    <div class="sub">单个导入需要目录中含 <code>SKILL.md</code>；扫描会递归发现所选目录下的全部 skills，并复制到 paihuo 工作目录登记入库</div>
    <label class="field">技能目录 / 扫描根目录
      <span class="dir-input-row">
        <input id="sSkillPath" data-autofocus placeholder="/path/to/skill-dir 或 skills-root" list="dlistSkill">
        <datalist id="dlistSkill"></datalist>
        <button type="button" class="btn sm" onclick="openDirPicker('sSkillPath')">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
          Browse…
        </button>
      </span>
    </label>
    <label class="field">标签（可选）
      <input id="sSkillTags" placeholder="多个标签用逗号分隔；扫描时会应用到本次导入的所有技能">
    </label>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('skillModal')">取消</button>
      <button class="btn" onclick="submitSkill()">导入当前目录</button>
      <button class="btn primary" onclick="scanSkills()">扫描并导入</button>
    </div>
  </div>
</div>

<!-- 添加 extension 弹窗 -->
<div class="modal hidden" id="extModal">
  <div class="modal-box">
    <h3>添加扩展</h3>
    <div class="sub">pi install 官方命令：来源可以是本地目录或远程仓库</div>
    <label class="field">来源
      <input id="extSource" data-autofocus placeholder="/path/to/extension 或 git 仓库地址">
    </label>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('extModal')">取消</button>
      <button class="btn primary" onclick="submitExt()">安装</button>
    </div>
  </div>
</div>
{{end}}
