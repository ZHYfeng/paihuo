{{define "content"}}
<header class="page-header">
  <span class="crumb">派活 / <b>Skills</b></span>
  <span class="spacer"></span>
  <button class="btn brand sm" onclick="openSkillModal()">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Add Skill
  </button>
</header>
<div class="page-content">
  <div class="toolbar">
    <span class="toolbar-note">技能库：定向添加本地技能（目录需含 <code>SKILL.md</code>），复制到 paihuo 工作目录后，Agents 配置里按名称勾选</span>
    <span class="spacer"></span>
    <span id="skillCount" class="count-info"></span>
  </div>
  <div class="skill-grid" id="skillGrid"></div>
  <div id="skillEmpty" class="empty hidden">技能库为空。点击右上角「Add Skill」，指定一个本地技能目录（含 SKILL.md）导入。</div>
</div>

<!-- 添加技能弹窗 -->
<div class="modal hidden" id="skillModal">
  <div class="modal-box">
    <h3>Add Skill</h3>
    <div class="sub">指定源目录（含 SKILL.md），paihuo 会把它复制到自己的工作目录登记入库</div>
    <label class="field">Source directory
      <span class="dir-input-row">
        <input id="sSkillPath" placeholder="/path/to/skill-dir" list="dlistSkill">
        <datalist id="dlistSkill"></datalist>
        <button type="button" class="btn sm" onclick="openDirPicker('sSkillPath')">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
          Browse…
        </button>
      </span>
    </label>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('skillModal')">Cancel</button>
      <button class="btn primary" onclick="submitSkill()">Import</button>
    </div>
  </div>
</div>
{{end}}
