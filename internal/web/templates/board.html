{{define "content"}}
<header class="page-header">
  <div class="page-identity">
    <span class="page-kicker">DELIVERY PIPELINE</span>
    <h1>任务看板</h1>
  </div>
  <span class="spacer"></span>
  <span class="header-note">聚焦流转，快速处理阻塞</span>
  <span class="kbd-hint"><kbd>N</kbd></span>
  <button class="btn brand sm" onclick="openNewTask()">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    新建任务
  </button>
</header>

<div class="page-content">
  <!-- 统计条 -->
  <div class="stats-strip board-stats" id="dashStats" aria-label="任务运行概览"></div>

  <!-- 看板 / 列表 -->
  <div id="boardShell">
    <div class="toolbar">
      <div class="seg" id="viewSeg">
        <button id="segBoard" class="active" onclick="setView('board')">看板</button>
        <button id="segList" onclick="setView('list')">列表</button>
      </div>
      <select id="fProject" class="sel-lg" aria-label="按项目筛选" onchange="applyFilters()"><option value="">全部项目</option></select>
      <a id="fProjectLink" class="chip-link" href="#" style="display:none" title="打开该项目的项目页">项目页 →</a>
      <select id="fAgent" class="sel-md" aria-label="按角色筛选" onchange="applyFilters()"><option value="">全部角色</option></select>
      <select id="fStatus" class="sel-sm" aria-label="按状态筛选" onchange="applyFilters()">
        <option value="">全部状态</option>
        <option value="queued">待执行</option>
        <option value="running">执行中</option>
        <option value="awaiting_review">待审批</option>
        <option value="succeeded">完成</option>
        <option value="failed">失败</option>
        <option value="cancelled">已取消</option>
      </select>
      <span class="spacer"></span>
      <span id="viewCount" class="count-info"></span>
    </div>
    <div id="boardView" class="board-view"></div>
    <div id="listView" class="list-wrap board-list-wrap hidden">
      <table class="list-grid board-list-grid" aria-label="任务列表">
        <caption class="sr-only">任务列表</caption>
        <thead><tr>
          <th>ID</th><th>标题</th><th>类型</th><th>角色</th><th>项目</th><th>状态</th><th>轮次</th><th>创建</th><th>结束</th><th class="task-list-actions-head">操作</th>
        </tr></thead>
        <tbody id="listBody"></tbody>
      </table>
      <div id="listEmpty" class="empty board-list-empty hidden">
        <b class="empty-title">没有符合条件的任务</b>
        <span class="empty-copy">调整项目、角色或状态筛选，继续查看任务流转。</span>
      </div>
    </div>
  </div>
</div>
{{end}}
