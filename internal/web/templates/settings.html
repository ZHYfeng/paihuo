{{define "content"}}
<div class="settings">
  <section>
    <div class="sec-head">
      <h3>角色（Agent）</h3>
      <button class="btn primary" onclick="openAgentModal()">新建角色</button>
    </div>
    <div id="agentList" class="card-list"></div>
  </section>

  <section>
    <div class="sec-head">
      <h3>定时任务</h3>
      <button class="btn primary" onclick="openScheduleModal()">新建定时任务</button>
    </div>
    <div id="scheduleList" class="card-list"></div>
  </section>
</div>

<div class="modal hidden" id="agentModal">
  <div class="modal-box wide">
    <h3 id="agentModalTitle">新建角色</h3>
    <input type="hidden" id="aId">
    <div class="row">
      <label>角色名 <input id="aName" placeholder="如：编码工"></label>
      <label>CLI
        <select id="aCli">
          <option value="omp">OMP（Oh My Pi）</option>
          <option value="opencode">OpenCode</option>
          <option value="pi">Pi Agent</option>
          <option value="claude">Claude Code</option>
          <option value="codex">Codex</option>
        </select>
      </label>
    </div>
    <label>绑定项目目录 <input id="aProjectDir" placeholder="/path/to/project"></label>
    <label>描述 <input id="aDesc" placeholder="这个角色负责什么"></label>
    <div class="row">
      <label>默认权限
        <select id="aPerm">
          <option value="full">完整</option>
          <option value="review">读 + 确认</option>
          <option value="readonly">只读</option>
        </select>
      </label>
      <label>模型 <input id="aModel" placeholder="留空用 CLI 默认，如 gpt-5.2"></label>
    </div>
    <label>系统提示词 <textarea id="aSysPrompt" rows="3" placeholder="角色定位、行为规范。会追加到 CLI 默认提示词之后"></textarea></label>
    <div class="row">
      <label>思考级别
        <select id="aThinking">
          <option value="">默认</option>
          <option value="low">低（快速/省钱）</option>
          <option value="medium">中</option>
          <option value="high">高（深度推理）</option>
        </select>
      </label>
      <label>技能目录（逗号分隔）<input id="aSkills" placeholder="/path/to/skills1,/path/to/skills2"></label>
    </div>
    <div class="row">
      <label>插件/配置文件（逗号分隔）<input id="aPlugins" placeholder="插件路径或配置叠加文件"></label>
      <label>额外参数（空格分隔）<input id="aExtra" placeholder="--no-lsp --no-session"></label>
    </div>
    <label>环境变量（每行 K=V）<textarea id="aEnv" rows="2" placeholder="KEY=VALUE"></textarea></label>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('agentModal')">取消</button>
      <button class="btn primary" onclick="submitAgent()">保存</button>
    </div>
  </div>
</div>

<div class="modal hidden" id="scheduleModal">
  <div class="modal-box">
    <h3>新建定时任务</h3>
    <input type="hidden" id="sId">
    <label>名称 <input id="sName" placeholder="每日巡检"></label>
    <div class="row">
      <label>Cron 表达式 <input id="sCron" placeholder="0 9 * * *" value="0 9 * * *"></label>
      <label>角色 <select id="sAgent"></select></label>
    </div>
    <label>标题模板 <input id="sTitle" placeholder="每日巡检 {{`{{.date}}`}}"></label>
    <label>提示词模板 <textarea id="sBody" rows="4" placeholder="检查服务状态并汇报。可用 {{`{{.date}}`}} 变量"></textarea></label>
    <label><input type="checkbox" id="sEnabled" checked> 启用</label>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('scheduleModal')">取消</button>
      <button class="btn primary" onclick="submitSchedule()">保存</button>
    </div>
  </div>
</div>
{{end}}
