{{define "content"}}
<header class="page-header">
  <span class="crumb">派活 / <b>设置</b></span>
  <span class="spacer"></span>
</header>
<div class="page-content">
  <div class="settings">
    <div>
      <div class="page-title">设置</div>
      <div class="page-sub">数据保留与清理策略</div>
    </div>

    <div class="settings-card">
      <div class="card-head">数据清理</div>
      <div class="card-body">
        <div class="set-row">
          <div>
            <div class="s-title">保留期限（自动清理）</div>
            <div class="s-sub">终态任务（完成/失败/取消）超过保留天数自动删除，含日志与会话。0 或留空 = 不自动清理</div>
          </div>
          <div class="s-ctl">
            <input id="retentionDays" type="number" min="0" placeholder="天数">
            <button class="btn sm" onclick="saveRetention()">保存</button>
          </div>
        </div>
        <div class="set-row">
          <div>
            <div class="s-title">手动清理</div>
            <div class="s-sub">按角色 / 时间批量删除历史任务（不可恢复）</div>
          </div>
          <div class="s-ctl">
            <select id="cleanupAgent" class="sel-md"><option value="">全部角色</option></select>
            <input id="cleanupDays" type="number" min="0" placeholder="早于N天" class="sel-xs">
            <button class="btn sm danger" onclick="runCleanup()">删除</button>
          </div>
        </div>
      </div>
    </div>

    <div class="settings-card">
      <div class="card-head">会话</div>
      <div class="card-body">
        <div class="set-row">
          <div>
            <div class="s-title">当前登录</div>
            <div class="s-sub">会话 cookie 30 天滑动有效；令牌改后全员重新登录</div>
          </div>
          <div class="s-ctl"><button class="btn sm" onclick="logout()">登出</button></div>
        </div>
        <div class="set-row">
          <div>
            <div class="s-title">服务信息</div>
            <div class="s-sub">单二进制部署于本机，任务在本地执行；数据库文件即完整备份</div>
          </div>
          <div class="s-ctl"><span class="count-info" id="srvInfo"></span></div>
        </div>
      </div>
    </div>
  </div>
</div>
{{end}}
