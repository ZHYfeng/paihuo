{{define "content"}}
<header class="page-header">
  <span class="crumb">派活 / <b>看板</b></span>
  <span class="spacer"></span>
  <button class="btn brand sm" onclick="openNewTask()">＋ 新建任务</button>
</header>

<div class="page-content">
  <!-- 看板 / 列表 -->
  <div id="boardShell">
    <div class="toolbar">
      <div class="seg" id="viewSeg">
        <button id="segBoard" class="active" onclick="setView('board')">看板</button>
        <button id="segList" onclick="setView('list')">列表</button>
      </div>
      <select id="fAgent" style="width:130px" onchange="applyFilters()"><option value="">全部角色</option></select>
      <select id="fStatus" style="width:110px" onchange="applyFilters()">
        <option value="">全部状态</option>
        <option value="queued">待执行</option>
        <option value="running">执行中</option>
        <option value="awaiting_review">待审批</option>
        <option value="succeeded">完成</option>
        <option value="failed">失败</option>
        <option value="cancelled">已取消</option>
      </select>
      <span class="spacer"></span>
      <span id="viewCount" style="font-size:12px;color:var(--fg-faint)"></span>
    </div>
    <div id="boardView" class="board-view"></div>
    <div id="listView" class="list-wrap hidden">
      <table class="list-grid">
        <thead><tr>
          <th class="chk"><input type="checkbox" id="hCheckAll" onclick="toggleAll()"></th>
          <th>ID</th><th>标题</th><th>角色</th><th>状态</th><th>轮次</th><th>创建</th><th>结束</th><th style="width:120px">操作</th>
        </tr></thead>
        <tbody id="listBody"></tbody>
      </table>
      <div id="listEmpty" class="empty hidden">没有符合条件的任务</div>
    </div>
  </div>

  <!-- 任务详情（两栏） -->
  <div id="detailShell" class="hidden">
    <header class="page-header">
      <button class="btn ghost sm" onclick="closeDetail()">← 返回</button>
      <span class="crumb" id="dCrumb"></span>
      <span class="spacer"></span>
      <span id="dBadge"></span>
    </header>
    <div class="detail-view">
      <div class="detail-main" id="dMain"></div>
      <aside class="detail-side" id="dSide"></aside>
    </div>
  </div>
</div>

<!-- 新建任务弹窗 -->
<div class="modal hidden" id="taskModal">
  <div class="modal-box">
    <h3 id="taskModalTitle">新建任务</h3>
    <div class="sub">指派给角色执行，可选用模板填充提示词</div>
    <input type="hidden" id="tParentId">
    <label class="field">从模板填充
      <select id="tTemplate" onchange="applyTemplate()"><option value="">—</option></select>
    </label>
    <label class="field">标题 <input id="tTitle" placeholder="要做什么"></label>
    <label class="field">提示词
      <textarea id="tBody" rows="5" placeholder="给 agent 的详细指令。留空则由标题生成。"></textarea>
    </label>
    <div class="row">
      <label class="field">角色 <select id="tAgent"></select></label>
      <label class="field">权限
        <select id="tPerm">
          <option value="full">完整（直接执行）</option>
          <option value="review">完成后审批</option>
        </select>
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('taskModal')">取消</button>
      <button class="btn primary" onclick="submitTask()">创建</button>
    </div>
  </div>
</div>

<!-- 全屏终端 -->
<div class="modal hidden" id="termModal">
  <div class="modal-box term-modal">
    <div class="term" style="margin:0;border-radius:0;border:none;flex:1;display:flex;flex-direction:column">
      <div class="term-head">
        <span class="term-dots"><i></i><i></i><i></i></span>
        <span class="t-title" id="termTitle"></span>
        <button class="btn ghost xs" onclick="closeModal('termModal')">关闭</button>
      </div>
      <div class="term-body term-full" id="termBox"></div>
    </div>
  </div>
</div>
{{end}}
